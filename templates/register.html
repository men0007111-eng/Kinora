{% extends "base.html" %}
{% block content %}
<form method="post" class="authbox">
  <h1>{{ t('register') }}</h1>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Login<input name="username" required minlength="3" maxlength="32" autocomplete="username"></label>
  <label>Email<input name="email" type="email" autocomplete="email"></label>
  <label>Parol (kamida 8 belgi)<input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
  <button class="btn big">{{ t('register') }}</button>
  <p class="muted"><a href="{{ url_for('login') }}">{{ t('login') }}</a></p>
</form>
{% endblock %}
