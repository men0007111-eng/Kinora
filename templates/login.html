{% extends "base.html" %}
{% block content %}
<form method="post" class="authbox">
  <h1>{{ t('login') }}</h1>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Login<input name="username" required autocomplete="username"></label>
  <label>Parol<input name="password" type="password" required autocomplete="current-password"></label>
  <button class="btn big">{{ t('login') }}</button>
  <p class="muted"><a href="{{ url_for('register') }}">{{ t('register') }}</a></p>
</form>
{% endblock %}
