{% extends "base.html" %}
{% block content %}
{% include "admin/_nav.html" %}
<form method="post" class="formbox">
  <h1>{{ "Yangi kontent" if new else "Kontentni tahrirlash" }}</h1>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Nomi<input name="title" required maxlength="150" value="{{ item.title or '' }}"></label>
  <label>Turi
    <select name="kind">
      <option value="movie" {{ 'selected' if item.kind == 'movie' }}>Kino</option>
      <option value="series" {{ 'selected' if item.kind == 'series' }}>Serial</option>
    </select>
  </label>
  <div class="two">
    <label>Yil<input name="year" type="number" min="1888" max="2100" value="{{ item.year or '' }}"></label>
    <label>Janr<input name="genre" maxlength="80" value="{{ item.genre or '' }}"></label>
  </div>
  <label>Tavsif<textarea name="description" rows="5" maxlength="3000">{{ item.description or '' }}</textarea></label>
  <label>Poster rasmi (https:// havola)<input name="poster_url" value="{{ item.poster_url or '' }}"></label>
  <label>Video (faqat qonuniy, litsenziyali manba — https:// embed havola)<input name="video_url" value="{{ item.video_url or '' }}"></label>
  <button class="btn big">Saqlash</button>
</form>
{% endblock %}
