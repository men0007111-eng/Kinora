{% extends "base.html" %}
{% block content %}
{% include "admin/_nav.html" %}
<form method="post" class="formbox">
  <h1>{{ "Yangi kontent" if new else "Kontentni tahrirlash" }}</h1>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Nomi<input name="title" required maxlength="150" value="{{ item.title or '' }}"></label>
  <div class="two">
    <label>Turi
      <select name="kind">
        <option value="movie" {{ 'selected' if item.kind == 'movie' }}>Kino</option>
        <option value="series" {{ 'selected' if item.kind == 'series' }}>Serial</option>
      </select>
    </label>
    <label>Yosh chegarasi (masalan 12+)<input name="age_rating" maxlength="10" value="{{ item.age_rating or '' }}"></label>
  </div>
  <div class="two">
    <label>Yil<input name="year" type="number" min="1888" max="2100" value="{{ item.year or '' }}"></label>
    <label>Davomiyligi (daqiqa)<input name="duration" type="number" min="1" max="1000" value="{{ item.duration or '' }}"></label>
  </div>
  <div class="two">
    <label>Janr<input name="genre" maxlength="80" value="{{ item.genre or '' }}"></label>
    <label>Davlat<input name="country" maxlength="80" value="{{ item.country or '' }}"></label>
  </div>
  <label>Rejissyor<input name="director" maxlength="120" value="{{ item.director or '' }}"></label>
  <label>Aktyorlar (vergul bilan)<input name="cast_list" maxlength="500" value="{{ item.cast_list or '' }}"></label>
  <label>Tavsif<textarea name="description" rows="5" maxlength="3000">{{ item.description or '' }}</textarea></label>
  <label>Poster rasmi (https:// havola)<input name="poster_url" value="{{ item.poster_url or '' }}"></label>
  <label>Video havola (https://). To'g'ridan-to'g'ri .mp4 / .webm havola yoki embed havola
    <input name="video_url" value="{{ item.video_url or '' }}"></label>
  <p class="muted">Faqat qonuniy, litsenziyasi bor kontent qo'shing.</p>
  <button class="btn big">Saqlash</button>
</form>
{% endblock %}
